<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PHASE｜門店盤點系統</title>
<link rel="manifest" href="manifest-store.json">
<link rel="icon" type="image/png" href="icons/store-192.png">
<link rel="apple-touch-icon" href="icons/store-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="門店盤點">
<style>
:root{
  --black:#111111; --gray-90:#1a1a1a; --gray-70:#4a4a4a; --gray-50:#888888;
  --gray-30:#c4c4c4; --gray-20:#d0d0d0; --gray-10:#e6e6e6; --gray-08:#f0f0f0; --white:#fafafa;
  --accent:#3D2A1C;
  --ok:#4caf7d; --warn:#e8a040; --danger:#c0453a;
  --radius:8px; --font:system-ui,-apple-system,'PingFang TC','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--gray-08);color:var(--black);font-size:15px;line-height:1.55;padding-bottom:60px;}
header{background:var(--black);color:var(--white);padding:16px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
header .store-name{font-size:18px;font-weight:600;letter-spacing:.02em;}
header .sync{margin-left:auto;font-size:11px;color:var(--gray-50);white-space:nowrap;}
.recall-banner{background:var(--danger);color:#fff;font-size:13.5px;font-weight:600;padding:10px 16px;text-align:center;cursor:pointer;}
.marquee-bar{background:#3D2A1C;color:#fff;overflow:hidden;white-space:nowrap;padding:7px 0;font-size:12.5px;cursor:pointer;}
.marquee-content{display:inline-block;padding-left:100%;animation:marquee-scroll 22s linear infinite;}
.marquee-bar:hover .marquee-content{animation-play-state:paused;}
@keyframes marquee-scroll{ 0%{transform:translateX(0);} 100%{transform:translateX(-100%);} }
.counter-bar{background:var(--gray-10);color:var(--gray-70);font-size:12.5px;padding:7px 16px;text-align:center;cursor:pointer;}
.counter-bar b{color:var(--black);}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--gray-20);position:sticky;top:56px;z-index:49;}
.tab-btn{flex:1;padding:13px 8px;border:none;background:none;font-size:14.5px;font-weight:600;color:var(--gray-50);border-bottom:3px solid transparent;font-family:inherit;}
.tab-btn.active{color:var(--black);border-bottom-color:var(--accent);}
main{max-width:640px;margin:0 auto;}
.tab-panel{display:none;padding:14px;}
.tab-panel.active{display:block;}
.section{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.section h2{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.item-group{border-top:1px solid var(--gray-08);padding-top:10px;margin-top:10px;}
.item-group:first-child{border-top:none;padding-top:0;margin-top:0;}
.item-group-title{font-weight:700;font-size:14px;margin-bottom:6px;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:9px 14px;font-size:13.5px;font-weight:600;font-family:inherit;}
.btn:disabled{background:var(--gray-30);color:var(--gray-50);}
.btn-sm{background:none;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600;font-family:inherit;}
.btn-outline{background:none;border:1px solid var(--gray-30);color:var(--gray-70);border-radius:6px;padding:6px 10px;font-size:12.5px;font-family:inherit;}
table{width:100%;border-collapse:collapse;font-size:13px;}
.batch-table{table-layout:fixed;}
.batch-table th:nth-child(1),.batch-table td:nth-child(1){width:44%;}
.batch-table th:nth-child(2),.batch-table td:nth-child(2){width:33%;}
.batch-table th:nth-child(3),.batch-table td:nth-child(3){width:23%;}
th,td{padding:8px 6px;border-bottom:1px solid var(--gray-08);text-align:left;vertical-align:middle;}
th{color:var(--gray-70);font-weight:700;font-size:11.5px;}
tr.batch-row.age-yellow{background:#fdf3d8;}
tr.batch-row.age-red{background:#fbe4e1;}
tr.batch-row.pending{opacity:.6;}
.legend{font-size:11.5px;color:var(--gray-50);margin-bottom:10px;display:flex;gap:12px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.batch-info .roast{color:var(--gray-70);font-size:12px;}
.batch-info .badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;background:var(--gray-30);color:#fff;margin-left:4px;}
.batch-qty-input{width:56px;padding:5px;border:1px solid var(--gray-20);border-radius:5px;font-size:13px;text-align:center;}
@media (max-width:480px){
  table,thead,tbody,tr{display:block;}
  th{display:none;}
  td{display:flex;justify-content:space-between;align-items:center;border:none;padding:4px 0;}
  td::before{content:attr(data-label);color:var(--gray-50);font-size:11.5px;white-space:nowrap;flex-shrink:0;}
  tr{border-bottom:1px solid var(--gray-10);padding:6px 0;}
  .date-age{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
  .tabs{-webkit-mask-image:linear-gradient(to right,#000 92%,transparent 100%);mask-image:linear-gradient(to right,#000 92%,transparent 100%);}
}
.empty-msg{color:var(--gray-50);font-size:13px;padding:8px 2px;}
.addon-item{border-top:1px solid var(--gray-08);padding:8px 0;font-size:13px;display:flex;justify-content:space-between;gap:8px;}
.status-pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.status-pending{background:#fdf3d8;color:#8a6d1a;}
.status-decided{background:var(--gray-10);color:var(--gray-70);}
.status-approved{background:#e3f3ea;color:#2c6e4a;}
.status-rejected{background:#fbe4e1;color:var(--danger);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:200;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:14px 14px 0 0;width:100%;max-width:640px;padding:18px;max-height:88vh;overflow:auto;}
.modal h3{font-size:16px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--gray-70);margin-bottom:4px;font-weight:600;}
.field select,.field input:not([type=checkbox]):not([type=radio]),.field textarea{width:100%;padding:9px 10px;border:1px solid var(--gray-20);border-radius:6px;font-size:14.5px;font-family:inherit;}
.field input[type=checkbox],.field input[type=radio]{width:auto;flex-shrink:0;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn,.modal-actions .btn-outline{flex:1;text-align:center;}
.picker{padding:40px 18px;text-align:center;}
.picker h1{font-size:18px;margin-bottom:20px;}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
.pin-dots{display:flex;justify-content:center;gap:9px;margin-bottom:10px;}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--black);display:inline-block;}
.pin-dots i.filled{background:var(--black);}
.pin-error{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:6px;}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.pin-keypad button{height:56px;border-radius:10px;border:1px solid var(--gray-20);background:#fff;font-size:19px;font-weight:600;font-family:inherit;}
.pin-keypad button:active{transform:scale(.96);}
.pin-keypad .pk-empty{visibility:hidden;}
</style>
</head>
<body>

<div id="pickerRoot" style="display:none" class="picker">
  <h1>PHASE｜門店盤點系統</h1>
  <div id="loginStoreSelect">
    <p style="color:var(--gray-50);font-size:13px;margin-bottom:20px;">請選擇門店</p>
    <div id="pickerList"></div>
  </div>
  <div id="loginPinPad" style="display:none;">
    <p id="pinStoreName" style="font-size:17px;font-weight:700;margin-bottom:4px;"></p>
    <p style="color:var(--gray-50);font-size:13px;margin-bottom:18px;">請輸入 8 位數 PIN 碼</p>
    <div class="pin-dots" id="pinDots"></div>
    <p class="pin-error" id="pinError">&nbsp;</p>
    <div class="pin-keypad" id="pinKeypad"></div>
    <button class="btn-outline" style="margin-top:20px;" onclick="backToStoreSelect()">返回選擇門店</button>
  </div>
  <div id="loginRoleSelect" style="display:none;">
    <p style="font-size:17px;font-weight:700;margin-bottom:20px;">請選擇登入身分</p>
    <button class="btn" style="width:100%;padding:16px;font-size:15px;margin-bottom:10px;" onclick="chooseRole('staff')">盤點作業</button>
    <button class="btn-outline" style="width:100%;padding:16px;font-size:15px;" onclick="chooseRole('viewer')">僅檢視</button>
  </div>
</div>

<div id="appRoot" style="display:none">
  <div id="announcementMarquee" class="marquee-bar" style="display:none;" onclick="switchTab('announcements')"><div class="marquee-content" id="marqueeContent"></div></div>
  <header>
    <div class="store-name" id="storeName">—</div>
    <div class="sync" id="syncStatus">連線中</div>
    <div style="position:relative;">
      <button onclick="toggleBackupMenu()" style="background:none;border:none;color:#fff;font-size:18px;padding:2px 6px;">⋯</button>
      <div id="backupMenu" style="display:none;position:absolute;right:0;top:28px;background:#fff;color:var(--black);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:150px;z-index:60;overflow:hidden;">
        <button onclick="exportBackup()" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;font-family:inherit;">⬇ 匯出本店資料</button>
        <button onclick="logout()" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;font-family:inherit;border-top:1px solid var(--gray-08);color:var(--danger);">登出</button>
      </div>
    </div>
  </header>
  <div id="recallBanner" class="recall-banner" style="display:none;" onclick="openRecallModal()"></div>
  <div id="announcementBanner" class="recall-banner" style="display:none;background:#3D2A1C;" onclick="openAnnouncementModal()"></div>
  <div id="counterBar" class="counter-bar"></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="retail" onclick="switchTab('retail')">架上販售豆</button>
    <button class="tab-btn" data-tab="brew" onclick="switchTab('brew')">門市沖煮豆</button>
    <button class="tab-btn" data-tab="filter" onclick="switchTab('filter')">濾掛</button>
    <button class="tab-btn" data-tab="otherstock" onclick="switchTab('otherstock')">其他店庫存</button>
    <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements')">公告</button>
  </div>
  <main>
    <section id="tab-retail" class="tab-panel active"></section>
    <section id="tab-brew" class="tab-panel"></section>
    <section id="tab-filter" class="tab-panel"></section>
    <section id="tab-otherstock" class="tab-panel"></section>
    <section id="tab-announcements" class="tab-panel"></section>
  </main>
  <div id="lastCountedFooter" class="counter-bar" style="cursor:default;"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ══════════ SUPABASE ══════════
const SB_URL = "https://ydcniebqwwkozddoiujr.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkY25pZWJxd3drb3pkZG9pdWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzY5NDUsImV4cCI6MjEwMTY1Mjk0NX0.Tyf4_Rx4l9YLvNd2jdnITuarA9StV2rQK0jT0nOrs6c";
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

function setSyncStatus(state){
  const el = document.getElementById('syncStatus');
  const map = { ok:['● 即時同步','#7bc99e'], local:['○ 離線','#e8a040'], loading:['⟳ 連線中','#999'] };
  const [text,color] = map[state] || map.loading;
  el.textContent = text; el.style.color = color;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
// 防止同一個送出動作被連續點擊/重複觸發造成重複資料
const _submitting = new Set();
async function guardSubmit(key, fn){
  if (_submitting.has(key)) return;
  _submitting.add(key);
  try{ await fn(); } finally { _submitting.delete(key); }
}

// ══════════ TAIPEI TIME（僅用於批次天數顯示，UTC+8 固定，台灣無日光節省時間） ══════════
function taipeiShifted(nowMs){ return new Date(nowMs + 8*3600*1000); }
function taipeiParts(nowMs){
  const s = taipeiShifted(nowMs);
  return { y:s.getUTCFullYear(), m:s.getUTCMonth(), d:s.getUTCDate() };
}
function todayTaipeiMidnightMs(nowMs){
  const p = taipeiParts(nowMs);
  return Date.UTC(p.y,p.m,p.d,0,0,0);
}
function ageDaysOf(roastDateStr, nowMs){
  const [ry,rm,rd] = roastDateStr.split('-').map(Number);
  return Math.floor((todayTaipeiMidnightMs(nowMs) - Date.UTC(ry,rm-1,rd,0,0,0)) / 86400000);
}

// ══════════ STATE ══════════
let STORE_ID = null, STORE_NAME = '', STORE_ROLE = 'staff';
let STORES = [], ITEMS = [];
let BATCHES = [], RETURNS = [], MY_TRANSFERS = [], OTHER_BATCHES = [], MY_RECEIPTS = [];
const TYPE_LABEL = { retail:'架上販售豆', brew:'門市沖煮豆', filter:'濾掛' };
const CAT_META = {
  G: { zh:'蜜處理・日曬', color:'#b0b0b0', text:'var(--black)' },
  Y: { zh:'水洗',         color:'#e8c43a', text:'var(--black)' },
  P: { zh:'自然發酵',     color:'#d47a7a', text:'#fff' },
  R: { zh:'特殊發酵',     color:'#8a1a1a', text:'#fff' },
  B: { zh:'堅果奶油',     color:'#5a2e0e', text:'#fff' },
  T: { zh:'台灣競標',     color:'#009ba8', text:'#fff' },
  X: { zh:'配方豆',       color:'#555555', text:'#fff' },
  O: { zh:'其他',         color:'#4a7c6f', text:'#fff' },
};
const CAT_ORDER = ['G','Y','P','R','B','T','X','O'];
function groupBatchesByCategory(rows, type){
  const groups = {};
  rows.forEach(b=>{
    const it = ITEMS.find(i=>i.id===b.item_id);
    const c = (it && it.category_code) || '';
    (groups[c] ||= []).push(b);
  });
  const codes = [...CAT_ORDER, ''].filter(c=>groups[c] && groups[c].length);
  return codes.map(c=>({
    meta: c ? CAT_META[c] : { zh:'未分類', color:'var(--gray-30)', text:'#fff' },
    rows: groups[c].sort((a,b)=> itemName(a.item_id).localeCompare(itemName(b.item_id)) || agePriority(b,type)-agePriority(a,type) || a.roast_date.localeCompare(b.roast_date))
  }));
}
function itemSelectOptionsGrouped(items){
  const groups = {};
  items.forEach(it=>{ const c = it.category_code || ''; (groups[c] ||= []).push(it); });
  const codes = [...CAT_ORDER, ''].filter(c=>groups[c] && groups[c].length);
  return codes.map(c=>{
    const label = c ? CAT_META[c].zh : '未分類';
    const opts = groups[c].map(it=>`<option value="${it.id}">${it.name}</option>`).join('');
    return `<optgroup label="${label}">${opts}</optgroup>`;
  }).join('');
}

// ══════════ 登入（PIN，邏輯同門市採購系統） ══════════
const PIN_LENGTH = 8;
const SESSION_KEY = 'phase_coffee_store_session';
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let pinBuffer = '', pinTargetStore = null, pinChecking = false;

function renderStorePicker(preselect){
  document.getElementById('pickerList').innerHTML = STORES.map(st =>
    `<button onclick="startPinLogin('${st.id}')" style="display:block;width:100%;background:#fff;border:none;border-radius:var(--radius);padding:16px;margin-bottom:10px;font-weight:600;font-size:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);">${st.name}</button>`).join('');
  document.getElementById('loginStoreSelect').style.display = 'block';
  document.getElementById('loginPinPad').style.display = 'none';
  if (preselect) startPinLogin(preselect);
}
function backToStoreSelect(){
  document.getElementById('loginStoreSelect').style.display = 'block';
  document.getElementById('loginPinPad').style.display = 'none';
}
function startPinLogin(storeId){
  pinTargetStore = storeId; pinBuffer = ''; pinChecking = false;
  const st = STORES.find(x=>x.id===storeId);
  document.getElementById('pinStoreName').textContent = st ? st.name : storeId;
  document.getElementById('pinError').textContent = ' ';
  document.getElementById('loginStoreSelect').style.display = 'none';
  document.getElementById('loginPinPad').style.display = 'block';
  renderPinDots();
  document.getElementById('pinKeypad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','del']
    .map(k => k==='' ? `<button class="pk-empty"></button>` :
      `<button onclick="pressPinKey('${k}')">${k==='del'?'清除':k}</button>`).join('');
}
function renderPinDots(){
  document.getElementById('pinDots').innerHTML = Array.from({length:PIN_LENGTH}, (_,i)=>
    `<i class="${i<pinBuffer.length?'filled':''}"></i>`).join('');
}
async function pressPinKey(k){
  if (pinChecking) return;
  if (k==='del'){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); return; }
  if (pinBuffer.length>=PIN_LENGTH) return;
  pinBuffer += k;
  renderPinDots();
  if (pinBuffer.length===PIN_LENGTH) await submitPin();
}
async function submitPin(){
  pinChecking = true;
  const hash = await sha256Hex(pinBuffer);
  const { data: ok } = await sb.rpc('verify_store_pin', { p_store_id: pinTargetStore, p_pin_hash: hash });
  pinChecking = false;
  if (ok){
    document.getElementById('loginPinPad').style.display = 'none';
    document.getElementById('loginRoleSelect').style.display = 'block';
  } else {
    const { data: hasPin } = await sb.rpc('store_has_pin', { p_store_id: pinTargetStore });
    document.getElementById('pinError').textContent = hasPin ? '密碼錯誤' : '此門店尚未設定 PIN，請聯絡管理者';
    setTimeout(()=>{ pinBuffer=''; renderPinDots(); document.getElementById('pinError').textContent=' '; }, 600);
  }
}
function chooseRole(role){
  localStorage.setItem(SESSION_KEY, JSON.stringify({ store: pinTargetStore, role }));
  enterStore(pinTargetStore, role);
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

// ══════════ INIT ══════════
async function init(){
  const params = new URLSearchParams(location.search);
  const urlStore = params.get('store');
  const { data: storeRows } = await sb.from('stores').select('*').order('sort_order');
  STORES = storeRows || [];

  document.getElementById('pickerRoot').style.display = 'block';

  let sessionStore = null, sessionRole = 'staff';
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw){ const parsed = JSON.parse(raw); if (STORES.find(x=>x.id===parsed.store)){ sessionStore = parsed.store; sessionRole = parsed.role || 'staff'; } }
  }catch(e){}

  if (sessionStore){
    enterStore(sessionStore, sessionRole);
  } else if (urlStore && STORES.find(x=>x.id===urlStore)){
    renderStorePicker(urlStore);
  } else {
    renderStorePicker(null);
  }
}
function enterStore(storeId, role){
  STORE_ID = storeId;
  STORE_ROLE = role || 'staff';
  STORE_NAME = STORES.find(x=>x.id===storeId)?.name || storeId;
  document.getElementById('pickerRoot').style.display = 'none';
  document.getElementById('storeName').textContent = STORE_NAME + (STORE_ROLE==='viewer' ? '（檢視模式）' : '');
  document.getElementById('appRoot').style.display = 'block';
  document.getElementById('counterBar').style.display = STORE_ROLE==='viewer' ? 'none' : 'block';
  const lastTab = localStorage.getItem(LAST_TAB_KEY);
  if (lastTab && document.getElementById('tab-'+lastTab)) switchTab(lastTab);
  loadCounterName();
  loadAll();
  subscribeRealtime();
  setInterval(()=>{ if (!isEditingInput()) render(); }, 30000);
  if (STORE_ROLE !== 'viewer') openCounterNameModal();
}

// ══════════ 盤點負責人 ══════════
// 一天當中可能換不同人操作，姓名不能無限期記住——超過 IDLE_LIMIT 沒有任何庫存異動
// 就視為換人，下次異動要重新輸入姓名（每次成功異動都會刷新時間，連續操作不會被打斷）。
const COUNTER_IDLE_LIMIT_MS = 20 * 60 * 1000; // 20 分鐘
let counterName = null, pendingCounterCallback = null;
function counterKey(){ return 'phase_coffee_counter_'+STORE_ID; }
function loadCounterName(){
  refreshCounterFromStorage();
  renderCounterBar();
}
function refreshCounterFromStorage(){
  try{
    const raw = localStorage.getItem(counterKey());
    if (!raw){ counterName = null; return; }
    const { name, ts } = JSON.parse(raw);
    counterName = (name && Date.now()-ts < COUNTER_IDLE_LIMIT_MS) ? name : null;
  }catch(e){ counterName = null; }
}
function touchCounterTimestamp(){
  if (!counterName) return;
  localStorage.setItem(counterKey(), JSON.stringify({ name:counterName, ts:Date.now() }));
}
function renderCounterBar(){
  const el = document.getElementById('counterBar');
  el.innerHTML = counterName
    ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
        <span onclick="openCounterNameModal()" style="cursor:pointer;">盤點人：${counterName}（點此更換）</span>
        <button class="btn" style="padding:6px 14px;font-size:12.5px;background:var(--ok);" onclick="openEndCountingModal()">✓ 結束盤點並簽名</button>
      </div>`
    : `<span onclick="openCounterNameModal()" style="cursor:pointer;">尚未設定盤點人，點此設定</span>`;
}
function ensureCounterName(onReady){
  if (STORE_ROLE==='viewer'){ toast('檢視模式無法執行此操作'); return; }
  refreshCounterFromStorage();
  if (counterName){ touchCounterTimestamp(); renderCounterBar(); onReady(); return; }
  pendingCounterCallback = onReady;
  openCounterNameModal();
}
function openCounterNameModal(){
  openModal(`
    <h3>設定盤點人</h3>
    <div class="field"><label>姓名（以示負責，庫存異動會記錄此姓名並回報工廠端）</label>
      <input type="text" id="counterNameInput" placeholder="請輸入姓名" value="${counterName||''}"></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="pendingCounterCallback=null; closeModal();">取消</button>
      <button class="btn" onclick="confirmCounterName()">確認</button>
    </div>`);
}
function confirmCounterName(){
  const name = document.getElementById('counterNameInput').value.trim();
  if (!name){ toast('請輸入姓名'); return; }
  counterName = name;
  localStorage.setItem(counterKey(), JSON.stringify({ name, ts:Date.now() }));
  renderCounterBar();
  closeModal();
  if (pendingCounterCallback){ const cb = pendingCounterCallback; pendingCounterCallback = null; cb(); }
}

// ══════════ 結束盤點電子簽名 ══════════
let sigCtx = null, sigDrawing = false, sigHasContent = false;
function openEndCountingModal(){
  if (!counterName){ toast('目前尚未設定盤點人'); return; }
  openModal(`
    <h3>結束盤點簽名</h3>
    <div class="field"><label>盤點人</label><div>${counterName}</div></div>
    <div class="field">
      <label>請簽名以示本人確認本次盤點</label>
      <canvas id="sigCanvas" width="500" height="200" style="border:1px solid var(--gray-30);border-radius:8px;touch-action:none;width:100%;height:180px;background:#fff;display:block;"></canvas>
      <button class="btn-outline" style="margin-top:8px;" onclick="clearSignature()">清除重簽</button>
    </div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModal()">取消</button>
      <button class="btn" onclick="confirmEndCounting()">確認送出</button>
    </div>`);
  setTimeout(initSignaturePad, 50);
}
function initSignaturePad(){
  const canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(dpr, dpr);
  sigCtx.lineWidth = 2.5;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigCtx.strokeStyle = '#111';
  sigHasContent = false;
  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  canvas.onpointerdown = (e)=>{ e.preventDefault(); sigDrawing = true; sigHasContent = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); };
  canvas.onpointermove = (e)=>{ if (!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); };
  canvas.onpointerup = ()=>{ sigDrawing = false; };
  canvas.onpointerleave = ()=>{ sigDrawing = false; };
}
function clearSignature(){
  const canvas = document.getElementById('sigCanvas');
  if (!canvas || !sigCtx) return;
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigHasContent = false;
}
async function confirmEndCounting(){
  if (!sigHasContent){ toast('請先簽名'); return; }
  const canvas = document.getElementById('sigCanvas');
  const signature_data = canvas.toDataURL('image/png');
  const { error } = await sb.from('counting_sessions').insert({ store_id:STORE_ID, counter_name:counterName, signature_data });
  if (error){ toast('簽名失敗：'+error.message); return; }
  localStorage.removeItem(counterKey());
  counterName = null;
  renderCounterBar();
  closeModal();
  toast('已完成盤點簽名');
}

async function loadAll(){
  setSyncStatus('loading');
  try{
    const [{data:items}, {data:batches}, {data:returns}, {data:transfers}, {data:receipts}] = await Promise.all([
      sb.from('items').select('*').eq('active', true).order('sort_order'),
      sb.from('batches').select('*').eq('store_id', STORE_ID).neq('status','disposed').order('roast_date'),
      sb.from('returns').select('*').eq('store_id', STORE_ID).order('submitted_at', {ascending:false}),
      sb.from('transfer_requests').select('*').eq('requesting_store_id', STORE_ID).order('requested_at', {ascending:false}),
      sb.from('announcement_receipts').select('*, announcement:announcements(*)').eq('store_id', STORE_ID)
    ]);
    ITEMS = items || []; BATCHES = batches || []; RETURNS = returns || []; MY_TRANSFERS = transfers || [];
    MY_RECEIPTS = (receipts || []).sort((a,b)=> new Date(b.announcement.created_at) - new Date(a.announcement.created_at));
    setSyncStatus('ok');
  }catch(e){ console.error(e); setSyncStatus('local'); }
  render();
}

// 正在輸入時（填數量等）不做背景重新整理，避免打字打到一半被蓋掉；
// 離開輸入框後才補做一次，確保資料還是會同步。
function isEditingInput(){
  const el = document.activeElement;
  if (!el) return false;
  return el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT';
}
let reloadTimer = null, pendingReload = false;
function scheduleReload(){
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(safeReload, 400);
}
function safeReload(){
  if (isEditingInput()){ pendingReload = true; return; }
  pendingReload = false;
  loadAll();
}
document.addEventListener('focusout', ()=>{
  if (!pendingReload) return;
  setTimeout(()=>{ if (!isEditingInput()){ pendingReload = false; loadAll(); } }, 150);
});
function subscribeRealtime(){
  const tables = ['items','batches','returns','transfer_requests','announcements','announcement_receipts'];
  const ch = sb.channel('store-realtime-'+STORE_ID);
  tables.forEach(t=>{
    ch.on('postgres_changes', { event:'*', schema:'public', table:t }, scheduleReload);
  });
  ch.subscribe(s=>{
    if (s==='SUBSCRIBED') setSyncStatus('ok');
    else if (s==='CHANNEL_ERROR') setSyncStatus('local');
  });
}

const LAST_TAB_KEY = 'phase_coffee_store_lasttab';
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+tab));
  localStorage.setItem(LAST_TAB_KEY, tab);
}

function render(){
  ['retail','brew','filter'].forEach(renderTab);
  checkRecallNotifications();
  renderOtherStockTab();
  checkAnnouncementNotifications();
  renderAnnouncementsTab();
  renderAnnouncementMarquee();
  renderLastCountedFooter();
}
function renderLastCountedFooter(){
  const el = document.getElementById('lastCountedFooter');
  if (!el) return;
  const counted = BATCHES.filter(b=>b.last_counted_at).sort((a,b)=>new Date(b.last_counted_at)-new Date(a.last_counted_at));
  if (!counted.length){ el.textContent = '尚無盤點紀錄'; return; }
  const latest = counted[0];
  el.innerHTML = `最後盤點：<b>${latest.last_counted_by||'—'}</b>・${fmtDTShort(latest.last_counted_at)}`;
}
function renderAnnouncementMarquee(){
  const bar = document.getElementById('announcementMarquee');
  const content = document.getElementById('marqueeContent');
  const recent = MY_RECEIPTS.slice(0, 5);
  if (!recent.length){ bar.style.display = 'none'; return; }
  content.textContent = recent.map(r => `📢 ${r.announcement.title ? r.announcement.title+'：' : ''}${r.announcement.content}`).join('　　｜　　');
  bar.style.display = 'block';
}

// ══════════ 工廠回收指示通知 ══════════
let notifiedReturnIds = new Set();
function pendingReturns(){ return RETURNS.filter(r=>r.status==='pending'); }
function checkRecallNotifications(){
  const pending = pendingReturns();
  const banner = document.getElementById('recallBanner');
  if (pending.length){
    banner.style.display = 'block';
    banner.textContent = `⚠ 有 ${pending.length} 筆工廠回收指示待完成，點此查看`;
  } else {
    banner.style.display = 'none';
  }
  const newOnes = pending.filter(r=>!notifiedReturnIds.has(r.id));
  if (newOnes.length){
    newOnes.forEach(r=>notifiedReturnIds.add(r.id));
    openRecallModal();
  }
}
function openRecallModal(){
  const pending = pendingReturns();
  if (!pending.length){ closeModal(); return; }
  openModal(`
    <h3>工廠回收指示</h3>
    <div id="recallModalList">${pending.map(r=>`
      <div class="addon-item" id="recall-item-${r.id}">
        <div>${itemName(r.item_id)} × ${r.quantity}（烘焙 ${r.roast_date}）<br>
          <span style="color:var(--gray-50)">工廠處置：${r.factory_decision||'—'}${r.decision_note ? '（'+r.decision_note+'）' : ''}</span></div>
        ${STORE_ROLE==='viewer' ? '' : `<div style="display:flex;gap:6px;">
          <button class="btn-sm" onclick="promptCompleteReturn(${r.id}, ${r.batch_id}, true)">標記完成</button>
          <button class="btn-outline" onclick="promptRejectReturn(${r.id}, true)">拒絕</button>
        </div>`}
      </div>`).join('')}</div>
    <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">稍後再處理</button></div>`);
}

// ══════════ 系統公告通知 ══════════
let notifiedAnnouncementIds = new Set();
function pendingAnnouncements(){ return MY_RECEIPTS.filter(r=>!r.received_at); }
function checkAnnouncementNotifications(){
  const pending = pendingAnnouncements();
  const banner = document.getElementById('announcementBanner');
  if (pending.length){
    banner.style.display = 'block';
    banner.textContent = `📢 有 ${pending.length} 則公告待確認接收，點此查看`;
  } else {
    banner.style.display = 'none';
  }
  const newOnes = pending.filter(r=>!notifiedAnnouncementIds.has(r.id));
  if (newOnes.length){
    newOnes.forEach(r=>notifiedAnnouncementIds.add(r.id));
    openAnnouncementModal();
  }
}
function openAnnouncementModal(){
  const pending = pendingAnnouncements();
  if (!pending.length){ closeModal(); return; }
  openModal(`
    <h3>系統公告</h3>
    <div>${pending.map(r=>`
      <div class="addon-item" style="display:block;">
        <div style="font-weight:700;margin-bottom:4px;">${r.announcement.title||'（無標題）'}</div>
        <div style="white-space:pre-wrap;margin-bottom:8px;">${r.announcement.content}</div>
        ${STORE_ROLE==='viewer' ? '' : `<button class="btn-sm" onclick="promptReceiptConfirm(${r.id}, true)">確認接收</button>`}
      </div>`).join('')}</div>
    <div class="modal-actions"><button class="btn-outline" onclick="closeModal()">稍後再處理</button></div>`);
}
function renderAnnouncementsTab(){
  const el = document.getElementById('tab-announcements');
  el.innerHTML = `<div class="section"><h2>系統公告</h2><div id="announcementList">${renderAnnouncementList()}</div></div>`;
}
function renderAnnouncementList(){
  if (!MY_RECEIPTS.length) return `<div class="empty-msg">目前沒有公告</div>`;
  return MY_RECEIPTS.map(r=>`
    <div class="addon-item" style="display:block;">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">
        <div style="font-weight:700;">${r.announcement.title||'（無標題）'}</div>
        ${r.received_at
          ? `<span class="status-pill status-decided">已接收</span>`
          : `<span class="status-pill status-pending">待確認</span>`}
      </div>
      <div style="color:var(--gray-50);font-size:12px;margin:2px 0 6px;">${fmtDTShort(r.announcement.created_at)}</div>
      <div style="white-space:pre-wrap;margin-bottom:8px;">${r.announcement.content}</div>
      ${r.received_at
        ? `<div style="color:var(--gray-50);font-size:12px;">由 ${r.received_by} 於 ${fmtDTShort(r.received_at)} 確認接收</div>`
        : (STORE_ROLE==='viewer' ? '' : `<button class="btn-sm" onclick="promptReceiptConfirm(${r.id}, false)">確認接收</button>`)}
    </div>`).join('');
}
function fmtDTShort(iso){
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function promptReceiptConfirm(receiptId, backToList){
  const r = MY_RECEIPTS.find(x=>x.id===receiptId);
  if (!r) return;
  openModal(`
    <h3>確認接收公告</h3>
    <div class="field"><label>公告內容</label><div style="white-space:pre-wrap;">${r.announcement.title?r.announcement.title+'：':''}${r.announcement.content}</div></div>
    <div class="field"><label>接收人姓名（以示負責）</label><input type="text" id="receiptNameInput" placeholder="請輸入姓名"></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="${backToList?'openAnnouncementModal()':'closeModal()'}">取消</button>
      <button class="btn" onclick="confirmReceipt(${receiptId}, ${backToList})">確認</button>
    </div>`);
}
async function confirmReceipt(receiptId, backToList){
  const name = document.getElementById('receiptNameInput').value.trim();
  if (!name){ toast('請輸入姓名'); return; }
  const { error } = await sb.from('announcement_receipts').update({ received_by:name, received_at:new Date().toISOString() }).eq('id', receiptId);
  if (error){ toast('確認失敗：'+error.message); return; }
  toast('已確認接收'); await loadAll();
  if (backToList && pendingAnnouncements().length) openAnnouncementModal(); else closeModal();
}

function itemName(id){ const it = ITEMS.find(i=>i.id===id); return it ? it.name : '（已停用品項）'; }

function renderTab(type){
  const el = document.getElementById('tab-'+type);
  el.innerHTML = `
    <div class="section">
      <h2>本店庫存${STORE_ROLE==='viewer' ? '' : `<button class="btn-sm" onclick="openAddBatchModal('${type}')">＋ 新增庫存</button>`}</h2>
      ${type==='retail' ? `<div class="legend"><span><i style="background:#e8c43a"></i>烘焙14–20天</span><span><i style="background:#c0453a"></i>烘焙21天以上</span></div>` : ''}
      <div id="${type}-batchList">${renderBatchList(type)}</div>
    </div>
    <div class="section">
      <h2>工廠回收指示</h2>
      <div id="${type}-returnList">${renderReturnList(type)}</div>
    </div>
  `;
}

function agePriority(b, type){
  if (type!=='retail') return 0;
  const age = ageDaysOf(b.roast_date, Date.now());
  if (age>=21) return 2;
  if (age>=14) return 1;
  return 0;
}
function renderBatchList(type){
  const rows = BATCHES.filter(b=>b.channel===type);
  if (!rows.length) return `<div class="empty-msg">目前沒有登記中的批次</div>`;
  const groups = groupBatchesByCategory(rows, type);
  return groups.map(g=>`
    <details open style="margin-bottom:8px;border:1px solid var(--gray-08);border-radius:6px;overflow:hidden;">
      <summary style="background:${g.meta.color};color:${g.meta.text};padding:9px 12px;font-weight:700;cursor:pointer;list-style:none;">
        ${g.meta.zh}（${g.rows.length}）
      </summary>
      <table class="batch-table">
        <thead><tr><th>品項</th><th>日期</th><th>包數</th></tr></thead>
        <tbody>${g.rows.map(b=>renderBatchRow(b,type)).join('')}</tbody>
      </table>
    </details>`).join('');
}
function renderBatchRow(b, type){
  const age = ageDaysOf(b.roast_date, Date.now());
  const pending = b.status==='return_pending';
  let ageCls = '';
  if (type==='retail'){ if (age>=21) ageCls='age-red'; else if (age>=14) ageCls='age-yellow'; }
  return `<tr class="batch-row ${ageCls} ${pending?'pending':''}">
    <td data-label="品項">${itemName(b.item_id)}</td>
    <td data-label="日期" class="batch-info"><span class="date-age">${b.roast_date} <span class="roast">（${age}天）</span>${pending?'<span class="badge">待回收完成</span>':''}</span></td>
    <td data-label="包數"><input class="batch-qty-input" type="number" min="0" value="${b.quantity}" ${(pending||STORE_ROLE==='viewer')?'disabled':''}
      onchange="updateBatchQty(${b.id}, this.value)"></td>
  </tr>`;
}
function updateBatchQty(id, val){
  ensureCounterName(()=>doUpdateBatchQty(id, val));
}
async function doUpdateBatchQty(id, val){
  const q = Number(val); if (isNaN(q) || q<0) return;
  const now = new Date().toISOString();
  const before = BATCHES.find(b=>b.id===id);
  const oldQty = before ? before.quantity : null;
  if (q === 0){
    if (!confirm('數量歸零，這筆批次會標記為已用罄並從庫存列表移除，確定嗎？')){ render(); return; }
    await sb.from('batches').update({ quantity:0, status:'disposed', disposal_action:'已用罄', updated_at:now, last_counted_by:counterName, last_counted_at:now }).eq('id', id);
    toast(`已標記用罄（盤點人：${counterName}）`);
  } else {
    await sb.from('batches').update({ quantity:q, updated_at:now, last_counted_by:counterName, last_counted_at:now }).eq('id', id);
    toast(`已更新數量（盤點人：${counterName}）`);
  }
  if (oldQty !== q){
    await sb.from('batch_history').insert({ batch_id:id, old_quantity:oldQty, new_quantity:q, changed_by:counterName });
  }
  loadAll();
}
function todayStr(){
  const p = taipeiParts(Date.now());
  return `${p.y}-${String(p.m+1).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
}
function openAddBatchModal(type){
  ensureCounterName(()=>doOpenAddBatchModal(type));
}
function doOpenAddBatchModal(type){
  const opts = itemSelectOptionsGrouped(ITEMS);
  const needsRoast = type !== 'filter';
  openModal(`
    <h3>新增庫存（${TYPE_LABEL[type]}）</h3>
    <div class="field"><label>品項</label><select id="nbItem">${opts}</select></div>
    ${needsRoast ? `<div class="field"><label>烘焙日期</label><input type="date" id="nbRoast" value="${todayStr()}" max="${todayStr()}"></div>` : ''}
    <div class="field"><label>包數</label><input type="number" id="nbQty" min="0" value="1"></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModal()">取消</button>
      <button class="btn" onclick="saveAddBatch('${type}')">新增</button>
    </div>`);
}
async function saveAddBatch(type){
  const item_id = Number(document.getElementById('nbItem').value);
  const roastInput = document.getElementById('nbRoast');
  const roast_date = roastInput ? roastInput.value : todayStr();
  const quantity = Number(document.getElementById('nbQty').value||0);
  if (!roast_date || quantity<0){ toast('請填寫完整資料'); return; }
  if (roast_date > todayStr()){ toast('烘焙日期不能晚於今天'); return; }
  await guardSubmit('saveAddBatch', async ()=>{
    const now = new Date().toISOString();
    const { error } = await sb.from('batches').insert({ store_id:STORE_ID, item_id, channel:type, roast_date, quantity, status:'active', source:'manual', last_counted_by:counterName, last_counted_at:now });
    if (error){ toast('新增失敗：'+error.message); return; }
    closeModal(); toast('已新增庫存'); loadAll();
  });
}

function renderReturnList(channel){
  const rows = channel ? RETURNS.filter(r=>r.channel===channel) : RETURNS;
  if (!rows.length) return `<div class="empty-msg">目前沒有工廠回收指示</div>`;
  const label = { pending:'待門店完成', decided:'已完成', rejected:'已拒絕', cancelled:'工廠已取消' };
  const cls = { pending:'status-pending', decided:'status-decided', rejected:'status-rejected', cancelled:'status-decided' };
  return rows.map(r=>`
    <div class="addon-item">
      <div>${itemName(r.item_id)} × ${r.quantity}（烘焙 ${r.roast_date}）<br>
        <span style="color:var(--gray-50)">工廠處置：${r.factory_decision||'—'}${r.decision_note ? '（'+r.decision_note+'）' : ''}${r.completed_by ? '　由 '+r.completed_by+(r.status==='rejected'?' 拒絕':' 完成') : ''}</span>
        ${r.reject_reason ? `<br><span style="color:var(--danger)">拒絕原因：${r.reject_reason}</span>` : ''}</div>
      ${r.status==='pending'
        ? (STORE_ROLE==='viewer' ? `<span class="status-pill status-pending">${label.pending}</span>` : `<div style="display:flex;gap:6px;"><button class="btn-sm" onclick="promptCompleteReturn(${r.id}, ${r.batch_id}, false)">標記完成</button><button class="btn-outline" onclick="promptRejectReturn(${r.id}, false)">拒絕</button></div>`)
        : `<span class="status-pill ${cls[r.status]}">${label[r.status]}</span>`}
    </div>`).join('');
}
function promptCompleteReturn(returnId, batchId, backToList){
  const r = RETURNS.find(x=>x.id===returnId);
  if (!r) return;
  openModal(`
    <h3>標記完成</h3>
    <div class="field"><label>項目</label><div>${itemName(r.item_id)} × ${r.quantity}（烘焙 ${r.roast_date}）</div></div>
    <div class="field"><label>經手人姓名（以示負責）</label><input type="text" id="completeByName" placeholder="請輸入姓名"></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="${backToList ? 'openRecallModal()' : 'closeModal()'}">取消</button>
      <button class="btn" onclick="confirmCompleteReturn(${returnId}, ${batchId}, ${backToList})">確認完成</button>
    </div>`);
}
async function confirmCompleteReturn(returnId, batchId, backToList){
  const name = document.getElementById('completeByName').value.trim();
  if (!name){ toast('請輸入姓名'); return; }
  const { error } = await sb.rpc('complete_return', { p_return_id:returnId, p_batch_id:batchId, p_name:name });
  if (error){ toast('更新失敗：'+error.message); return; }
  toast('已標記完成'); await loadAll();
  if (backToList && pendingReturns().length) openRecallModal(); else closeModal();
}
function promptRejectReturn(returnId, backToList){
  const r = RETURNS.find(x=>x.id===returnId);
  if (!r) return;
  openModal(`
    <h3>拒絕回收</h3>
    <div class="field"><label>項目</label><div>${itemName(r.item_id)} × ${r.quantity}（烘焙 ${r.roast_date}）</div></div>
    <div class="field"><label>拒絕原因</label><textarea id="rejectReason" placeholder="請說明拒絕原因…"></textarea></div>
    <div class="field"><label>經手人姓名（以示負責）</label><input type="text" id="rejectByName" placeholder="請輸入姓名"></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="${backToList ? 'openRecallModal()' : 'closeModal()'}">取消</button>
      <button class="btn" onclick="confirmRejectReturn(${returnId}, ${backToList})">確認拒絕</button>
    </div>`);
}
async function confirmRejectReturn(returnId, backToList){
  const reason = document.getElementById('rejectReason').value.trim();
  const name = document.getElementById('rejectByName').value.trim();
  if (!reason){ toast('請輸入拒絕原因'); return; }
  if (!name){ toast('請輸入姓名'); return; }
  const { error } = await sb.rpc('reject_return', { p_return_id:returnId, p_reason:reason, p_name:name });
  if (error){ toast('操作失敗：'+error.message); return; }
  toast('已拒絕回收，批次恢復為正常庫存'); await loadAll();
  if (backToList && pendingReturns().length) openRecallModal(); else closeModal();
}

// ══════════ 其他店庫存查看 + 調貨申請 ══════════
let otherStockShellBuilt = false;
function storeNameOf(id){ const s = STORES.find(x=>x.id===id); return s ? s.name : id; }
function renderOtherStockTab(){
  const el = document.getElementById('tab-otherstock');
  if (!otherStockShellBuilt){
    const others = STORES.filter(s=>s.id!==STORE_ID);
    const storeOpts = others.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
    el.innerHTML = `
      <div class="section">
        <h2>${STORE_NAME}庫存總覽（全頻道）</h2>
        <div id="ownStockSummary"></div>
      </div>
      <div class="section">
        <h2>查看其他門店庫存</h2>
        <p style="color:var(--gray-50);font-size:12px;margin-bottom:10px;">僅供查看，無法在此調整其他門店的庫存。切換門店會整合顯示該店所有頻道的庫存。</p>
        <div style="margin-bottom:10px;">
          <select id="otherStoreSelect" onchange="loadOtherStock()">${storeOpts}</select>
        </div>
        <div id="otherStockList"><div class="empty-msg">載入中…</div></div>
      </div>
      <div class="section">
        <h2>我的調貨申請</h2>
        <p style="color:var(--gray-50);font-size:12px;margin-bottom:8px;">核准後系統不會自動調整雙方庫存數量，請雙方門店自行盤點調整。</p>
        <div id="transferRequestList"></div>
      </div>`;
    otherStockShellBuilt = true;
  }
  if (STORES.filter(s=>s.id!==STORE_ID).length) loadOtherStock();
  renderOwnStockSummary();
  renderMyTransfers();
}
function groupedStockHtml(batchList, allowTransferRequest){
  if (!batchList.length) return `<div class="empty-msg">目前沒有庫存資料</div>`;
  return ['retail','brew','filter'].map(ch=>{
    const rows = batchList.filter(b=>b.channel===ch)
      .sort((a,b)=> itemName(a.item_id).localeCompare(itemName(b.item_id)) || agePriority(b,ch)-agePriority(a,ch) || a.roast_date.localeCompare(b.roast_date));
    if (!rows.length) return '';
    return `<div class="item-group">
      <div class="item-group-title">${TYPE_LABEL[ch]}</div>
      ${ch==='retail' ? `<div class="legend"><span><i style="background:#e8c43a"></i>烘焙14–20天</span><span><i style="background:#c0453a"></i>烘焙21天以上</span></div>` : ''}
      <table>
        <thead><tr><th>品項</th><th>日期</th><th>包數</th><th></th></tr></thead>
        <tbody>${rows.map(b=>{
          const age = ageDaysOf(b.roast_date, Date.now());
          let ageCls = '';
          if (ch==='retail'){ if (age>=21) ageCls='batch-row age-red'; else if (age>=14) ageCls='batch-row age-yellow'; }
          return `<tr class="${ageCls}">
            <td data-label="品項">${itemName(b.item_id)}</td>
            <td data-label="日期"><span class="date-age">${b.roast_date}（${age}天）</span></td>
            <td data-label="包數">${b.quantity}</td>
            <td data-label="">${allowTransferRequest ? `<button class="btn-sm" onclick="openTransferRequestModal(${b.id})">申請調貨</button>` : ''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }).join('') || `<div class="empty-msg">目前沒有庫存資料</div>`;
}
function renderOwnStockSummary(){
  const el = document.getElementById('ownStockSummary');
  if (!el) return;
  el.innerHTML = groupedStockHtml(BATCHES, false);
}
async function loadOtherStock(){
  const storeId = document.getElementById('otherStoreSelect').value;
  if (!storeId){ OTHER_BATCHES = []; renderOtherStockList(); return; }
  const { data } = await sb.from('batches').select('*').eq('store_id', storeId).neq('status','disposed').order('roast_date');
  OTHER_BATCHES = data || [];
  renderOtherStockList();
}
function renderOtherStockList(){
  const el = document.getElementById('otherStockList');
  el.innerHTML = groupedStockHtml(OTHER_BATCHES, STORE_ROLE!=='viewer');
}
function openTransferRequestModal(batchId){
  ensureCounterName(()=>doOpenTransferRequestModal(batchId));
}
function doOpenTransferRequestModal(batchId){
  const b = OTHER_BATCHES.find(x=>x.id===batchId);
  if (!b) return;
  openModal(`
    <h3>申請調貨</h3>
    <div class="field"><label>來源門店</label><div>${storeNameOf(b.store_id)}（${TYPE_LABEL[b.channel]}）</div></div>
    <div class="field"><label>品項</label><div>${itemName(b.item_id)}（烘焙 ${b.roast_date}，該店現有 ${b.quantity} 包）</div></div>
    <div class="field"><label>需求包數（上限 ${b.quantity}）</label><input type="number" id="trQty" min="1" max="${b.quantity}" value="1"></div>
    <div class="field"><label>原因</label><textarea id="trReason" placeholder="例：本店缺貨、活動需求…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-outline" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitTransferRequest(${batchId})">送出申請</button>
    </div>`);
}
async function submitTransferRequest(batchId){
  const b = OTHER_BATCHES.find(x=>x.id===batchId);
  if (!b) return;
  const quantity = Number(document.getElementById('trQty').value||0);
  const reason = document.getElementById('trReason').value.trim();
  if (quantity<=0){ toast('請輸入數量'); return; }
  if (quantity>b.quantity){ toast(`數量不能超過該店現有的 ${b.quantity} 包`); return; }
  await guardSubmit('submitTransferRequest', async ()=>{
    const { error } = await sb.from('transfer_requests').insert({
      requesting_store_id:STORE_ID, source_store_id:b.store_id, item_id:b.item_id, channel:b.channel,
      quantity, reason, requested_by:counterName, status:'pending'
    });
    if (error){ toast('送出失敗：'+error.message); return; }
    closeModal(); toast('已送出調貨申請'); loadAll();
  });
}
function renderMyTransfers(){
  const el = document.getElementById('transferRequestList');
  if (!el) return;
  if (!MY_TRANSFERS.length){ el.innerHTML = `<div class="empty-msg">尚無調貨申請</div>`; return; }
  const label = { pending:'待審核', approved:'已核准', rejected:'已拒絕' };
  const cls = { pending:'status-pending', approved:'status-approved', rejected:'status-rejected' };
  el.innerHTML = MY_TRANSFERS.map(t=>`
    <div class="addon-item">
      <div>向 ${storeNameOf(t.source_store_id)} 申請 ${itemName(t.item_id)} × ${t.quantity}（${TYPE_LABEL[t.channel]}）<br>
        <span style="color:var(--gray-50)">${t.reason||''}${t.decision_note ? '　回覆：'+t.decision_note : ''}</span></div>
      <span class="status-pill ${cls[t.status]}">${label[t.status]}</span>
    </div>`).join('');
}

// ══════════ MODALS ══════════
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if (e.target.id==='overlay') closeModal(); });

// ══════════ 備份 + PWA ══════════
function toggleBackupMenu(){
  const el = document.getElementById('backupMenu');
  el.style.display = el.style.display==='block' ? 'none' : 'block';
}
document.addEventListener('click', e=>{
  const menu = document.getElementById('backupMenu');
  if (!menu) return;
  if (!e.target.closest('#backupMenu') && e.target.tagName!=='BUTTON'){ menu.style.display='none'; }
});
async function exportBackup(){
  toggleBackupMenu();
  const [{data:batches},{data:returns}] = await Promise.all([
    sb.from('batches').select('*').eq('store_id', STORE_ID),
    sb.from('returns').select('*').eq('store_id', STORE_ID)
  ]);
  const payload = { exported_at:new Date().toISOString(), source:'store.html:'+STORE_ID,
    tables: { batches:batches||[], returns:returns||[] } };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `phase-coffee-ops_${STORE_ID}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

init();
</script>
