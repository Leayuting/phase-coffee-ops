<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHASE｜工廠端 盤點管理</title>
<link rel="manifest" href="manifest-factory.json">
<link rel="icon" type="image/png" href="icons/factory-192.png">
<link rel="apple-touch-icon" href="icons/factory-192.png">
<meta name="theme-color" content="#3D2A1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="工廠管理">
<style>
:root{
  --black:#111111; --gray-90:#1a1a1a; --gray-70:#4a4a4a; --gray-50:#888888;
  --gray-30:#c4c4c4; --gray-20:#d0d0d0; --gray-10:#e6e6e6; --gray-08:#f0f0f0; --white:#fafafa;
  --accent:#3D2A1C;
  --ok:#4caf7d; --warn:#e8a040; --danger:#c0453a;
  --yellow-bg:#fdf3d8; --yellow-bd:#e8c43a;
  --red-bg:#fbe4e1; --red-bd:#c0453a;
  --radius:8px; --font:system-ui,-apple-system,'PingFang TC','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--gray-08);color:var(--black);font-size:14px;line-height:1.55;}
header{background:var(--black);color:var(--white);padding:16px 24px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
header .title{font-size:17px;font-weight:600;}
header .sync{margin-left:auto;font-size:11px;color:var(--gray-50);}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--gray-20);position:sticky;top:56px;z-index:49;overflow-x:auto;}
.tab-btn{padding:13px 18px;border:none;background:none;font-size:13.5px;font-weight:600;color:var(--gray-50);border-bottom:3px solid transparent;font-family:inherit;white-space:nowrap;}
.tab-btn.active{color:var(--black);border-bottom-color:var(--accent);}
main{max-width:1100px;margin:0 auto;padding:18px;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.section{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
.section h2{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap;}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn:disabled{background:var(--gray-30);color:var(--gray-50);cursor:default;}
.btn-sm{background:none;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;}
.btn-outline{background:none;border:1px solid var(--gray-30);color:var(--gray-70);border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;}
.btn-danger{background:var(--danger);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:8px 10px;border-bottom:1px solid var(--gray-08);text-align:left;vertical-align:top;}
th{color:var(--gray-70);font-weight:700;font-size:12px;background:var(--gray-08);position:sticky;top:0;}
input[type=text],input[type=number],input[type=date],select,textarea{padding:6px 8px;border:1px solid var(--gray-20);border-radius:5px;font-size:13px;font-family:inherit;}
.mini-input{width:64px;}
.item-name-input{width:100%;border:1px solid transparent;background:none;font-size:13.5px;font-weight:600;}
.item-name-input:focus{border-color:var(--gray-20);background:#fff;}
.empty-msg{color:var(--gray-50);font-size:13px;padding:10px 2px;}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--gray-30);color:#fff;}
.legend{font-size:11.5px;color:var(--gray-50);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:4px;}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}
.batch-line{padding:5px 8px;border-radius:5px;background:var(--gray-08);margin-bottom:4px;font-size:12.5px;}
.batch-line.age-yellow{background:var(--yellow-bg);border:1px solid var(--yellow-bd);}
.batch-line.age-red{background:var(--red-bg);border:1px solid var(--red-bd);}
.batch-line.pending{border:1px solid var(--warn);}
.item-block{border-top:1px solid var(--gray-08);padding:12px 0;}
.item-block:first-child{border-top:none;}
.item-block-title{font-weight:700;font-size:14px;margin-bottom:8px;}
.store-col{margin-bottom:6px;}
.store-col .store-label{font-size:11.5px;color:var(--gray-70);font-weight:700;margin-bottom:3px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.status-pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.status-pending{background:var(--yellow-bg);color:#8a6d1a;}
.status-decided{background:var(--gray-10);color:var(--gray-70);}
.status-approved{background:#e3f3ea;color:#2c6e4a;}
.status-rejected{background:var(--red-bg);color:var(--danger);}
.addon-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--gray-08);flex-wrap:wrap;}
.addon-row:first-child{border-top:none;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;}
.overlay.show{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:420px;padding:20px;max-height:88vh;overflow:auto;}
.modal h3{font-size:16px;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:var(--gray-70);margin-bottom:4px;font-weight:600;}
.field select,.field input,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--gray-20);border-radius:6px;font-size:14.5px;font-family:inherit;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions .btn,.modal-actions .btn-outline{flex:1;text-align:center;}
@media (max-width:800px){
  .grid3{grid-template-columns:1fr;}
  table,thead,tbody,tr{display:block;}
  th{display:none;}
  td{display:flex;justify-content:space-between;align-items:center;gap:10px;border:none;padding:5px 0;text-align:right;}
  td::before{content:attr(data-label);color:var(--gray-50);font-size:11.5px;text-align:left;white-space:nowrap;}
  tr{border-bottom:1px solid var(--gray-10);padding:8px 0;}
  header{padding:14px 16px;flex-wrap:wrap;}
  header .title{font-size:15px;}
  main{padding:12px;}
  .section{padding:13px;}
}
.picker{padding:60px 18px;text-align:center;max-width:340px;margin:0 auto;}
.picker h1{font-size:18px;margin-bottom:24px;}
.pin-dots{display:flex;justify-content:center;gap:9px;margin-bottom:10px;}
.pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--black);display:inline-block;}
.pin-dots i.filled{background:var(--black);}
.pin-error{color:var(--danger);font-size:13px;min-height:20px;margin-bottom:6px;}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.pin-keypad button{height:56px;border-radius:10px;border:1px solid var(--gray-20);background:#fff;font-size:19px;font-weight:600;font-family:inherit;cursor:pointer;}
.pin-keypad button:active{transform:scale(.96);}
.pin-keypad .pk-empty{visibility:hidden;}
</style>
</head>
<body>

<div id="pickerRoot" class="picker">
  <h1>PHASE｜工廠端 盤點管理</h1>
  <p style="color:var(--gray-50);font-size:13px;margin-bottom:18px;">請輸入 8 位數 PIN 碼</p>
  <div class="pin-dots" id="pinDots"></div>
  <p class="pin-error" id="pinError">&nbsp;</p>
  <div class="pin-keypad" id="pinKeypad"></div>
</div>

<div id="appRoot" style="display:none">
<header>
  <div class="title">PHASE｜工廠端 盤點管理</div>
  <div class="sync" id="syncStatus">連線中</div>
  <div style="position:relative;">
    <button onclick="toggleBackupMenu()" style="background:none;border:none;color:#fff;font-size:18px;padding:2px 6px;cursor:pointer;">⋯</button>
    <div id="backupMenu" style="display:none;position:absolute;right:0;top:28px;background:#fff;color:var(--black);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:160px;z-index:60;overflow:hidden;">
      <button onclick="exportBackup()" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;font-family:inherit;cursor:pointer;">⬇ 匯出全部備份</button>
      <button onclick="document.getElementById('restoreFileInput').click()" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;font-family:inherit;border-top:1px solid var(--gray-08);cursor:pointer;">⬆ 匯入還原</button>
      <button onclick="logout()" style="display:block;width:100%;text-align:left;padding:10px 14px;border:none;background:none;font-size:13px;font-family:inherit;border-top:1px solid var(--gray-08);color:var(--danger);cursor:pointer;">登出</button>
    </div>
  </div>
  <input type="file" id="restoreFileInput" accept=".json" style="display:none" onchange="handleRestoreFile(event)">
</header>
<div class="tabs">
  <button class="tab-btn active" data-tab="items" onclick="switchTab('items')">品項管理</button>
  <button class="tab-btn" data-tab="alert" onclick="switchTab('alert')">販售豆總覽</button>
  <button class="tab-btn" data-tab="brewboard" onclick="switchTab('brewboard')">沖煮豆總覽</button>
  <button class="tab-btn" data-tab="filterboard" onclick="switchTab('filterboard')">濾掛總覽</button>
  <button class="tab-btn" data-tab="transfers" onclick="switchTab('transfers')">調貨申請</button>
  <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements')">系統公告</button>
  <button class="tab-btn" data-tab="reports" onclick="switchTab('reports')">報表</button>
  <button class="tab-btn" data-tab="settings" onclick="switchTab('settings')">系統設定</button>
</div>
<main>
  <section id="tab-items" class="tab-panel active"></section>
  <section id="tab-alert" class="tab-panel"></section>
  <section id="tab-brewboard" class="tab-panel"></section>
  <section id="tab-filterboard" class="tab-panel"></section>
  <section id="tab-transfers" class="tab-panel"></section>
  <section id="tab-announcements" class="tab-panel"></section>
  <section id="tab-reports" class="tab-panel"></section>
  <section id="tab-settings" class="tab-panel"></section>
</main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
// ══════════ SUPABASE ══════════
const SB_URL = "https://ydcniebqwwkozddoiujr.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkY25pZWJxd3drb3pkZG9pdWpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwNzY5NDUsImV4cCI6MjEwMTY1Mjk0NX0.Tyf4_Rx4l9YLvNd2jdnITuarA9StV2rQK0jT0nOrs6c";
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY);

function setSyncStatus(state){
  const el = document.getElementById('syncStatus');
  const map = { ok:['● 即時同步','#7bc99e'], local:['○ 離線','#e8a040'], loading:['⟳ 連線中','#999'] };
  const [text,color] = map[state] || map.loading;
  el.textContent = text; el.style.color = color;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  t.style.opacity = 1;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.opacity = 0; }, 2200);
}

// ══════════ TAIPEI TIME HELPERS ══════════
function taipeiShifted(nowMs){ return new Date(nowMs + 8*3600*1000); }
function taipeiParts(nowMs){
  const s = taipeiShifted(nowMs);
  return { y:s.getUTCFullYear(), m:s.getUTCMonth(), d:s.getUTCDate(), dow:s.getUTCDay() };
}
function dateStr(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function fmtDT(ms){
  const s = taipeiShifted(ms);
  return `${s.getUTCMonth()+1}/${s.getUTCDate()} ${String(s.getUTCHours()).padStart(2,'0')}:${String(s.getUTCMinutes()).padStart(2,'0')}`;
}
function todayTaipeiMidnightMs(nowMs){ const p = taipeiParts(nowMs); return Date.UTC(p.y,p.m,p.d,0,0,0); }
function ageDaysOf(roastDateStr, nowMs){
  const [ry,rm,rd] = roastDateStr.split('-').map(Number);
  return Math.floor((todayTaipeiMidnightMs(nowMs) - Date.UTC(ry,rm-1,rd,0,0,0)) / 86400000);
}
function todayStr(){ const p = taipeiParts(Date.now()); return dateStr(p.y,p.m,p.d); }

// ══════════ STATE ══════════
let STORES = [], ITEMS_ALL = [], ITEMS = [];
let BATCHES = [], RETURNS = [], TRANSFERS = [];
let ANNOUNCEMENTS = [], RECEIPTS = [];

const DECISIONS = ['調回','變成出杯豆','報廢','其他'];

// ══════════ 登入（PIN，邏輯同門市採購系統） ══════════
const PIN_LENGTH = 8;
const SESSION_KEY = 'phase_coffee_factory_session';
const LAST_TAB_KEY = 'phase_coffee_factory_lasttab';
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let pinBuffer = '', pinChecking = false;
function renderPinDots(){
  document.getElementById('pinDots').innerHTML = Array.from({length:PIN_LENGTH}, (_,i)=>
    `<i class="${i<pinBuffer.length?'filled':''}"></i>`).join('');
}
function showLogin(){
  pinBuffer=''; pinChecking=false;
  document.getElementById('pickerRoot').style.display='block';
  document.getElementById('appRoot').style.display='none';
  renderPinDots();
  document.getElementById('pinError').textContent=' ';
  document.getElementById('pinKeypad').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','del']
    .map(k => k==='' ? `<button class="pk-empty"></button>` :
      `<button onclick="pressPinKey('${k}')">${k==='del'?'清除':k}</button>`).join('');
}
async function pressPinKey(k){
  if (pinChecking) return;
  if (k==='del'){ pinBuffer = pinBuffer.slice(0,-1); renderPinDots(); return; }
  if (pinBuffer.length>=PIN_LENGTH) return;
  pinBuffer += k;
  renderPinDots();
  if (pinBuffer.length===PIN_LENGTH) await submitPin();
}
async function submitPin(){
  pinChecking = true;
  const { data } = await sb.from('factory_auth').select('pin_hash').eq('id','factory').maybeSingle();
  const hash = await sha256Hex(pinBuffer);
  pinChecking = false;
  if (data && data.pin_hash === hash){
    localStorage.setItem(SESSION_KEY, '1');
    enterApp();
  } else {
    document.getElementById('pinError').textContent = '密碼錯誤';
    setTimeout(()=>{ pinBuffer=''; renderPinDots(); document.getElementById('pinError').textContent=' '; }, 600);
  }
}
function logout(){
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}
function enterApp(){
  document.getElementById('pickerRoot').style.display='none';
  document.getElementById('appRoot').style.display='block';
  const lastTab = localStorage.getItem(LAST_TAB_KEY);
  if (lastTab && document.getElementById('tab-'+lastTab)) switchTab(lastTab);
  init();
}

async function init(){
  await loadAll();
  subscribeRealtime();
  setInterval(()=>{ if (!isEditingInput()) render(); }, 30000);
}

if (localStorage.getItem(SESSION_KEY) === '1'){ enterApp(); } else { showLogin(); }

async function loadAll(){
  setSyncStatus('loading');
  try{
    const [{data:stores},{data:itemsAll},{data:batches},{data:returns},{data:transfers},{data:announcements},{data:receipts}] = await Promise.all([
      sb.from('stores').select('*').order('sort_order'),
      sb.from('items').select('*').order('sort_order'),
      sb.from('batches').select('*').neq('status','disposed').order('roast_date'),
      sb.from('returns').select('*').order('submitted_at',{ascending:false}),
      sb.from('transfer_requests').select('*').order('requested_at',{ascending:false}),
      sb.from('announcements').select('*').order('created_at',{ascending:false}),
      sb.from('announcement_receipts').select('*')
    ]);
    STORES = stores || []; ITEMS_ALL = itemsAll || []; ITEMS = ITEMS_ALL.filter(i=>i.active);
    BATCHES = batches || []; RETURNS = returns || []; TRANSFERS = transfers || [];
    ANNOUNCEMENTS = announcements || []; RECEIPTS = receipts || [];
    setSyncStatus('ok');
  }catch(e){ console.error(e); setSyncStatus('local'); }
  render();
}

// 正在輸入時（品項編輯/分配數量/備註等）不做背景重新整理，避免打字打到一半被蓋掉；
// 離開輸入框後才補做一次，確保資料還是會同步。
function isEditingInput(){
  const el = document.activeElement;
  if (!el) return false;
  return el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT';
}
let reloadTimer=null, pendingReload=false;
function scheduleReload(){ clearTimeout(reloadTimer); reloadTimer=setTimeout(safeReload,400); }
function safeReload(){
  if (isEditingInput()){ pendingReload = true; return; }
  pendingReload = false;
  loadAll();
}
document.addEventListener('focusout', ()=>{
  if (!pendingReload) return;
  setTimeout(()=>{ if (!isEditingInput()){ pendingReload = false; loadAll(); } }, 150);
});
function subscribeRealtime(){
  const tables = ['stores','items','batches','returns','transfer_requests','announcements','announcement_receipts'];
  const ch = sb.channel('factory-realtime');
  tables.forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t}, scheduleReload));
  ch.subscribe(s=>{
    if (s==='SUBSCRIBED') setSyncStatus('ok');
    else if (s==='CHANNEL_ERROR') setSyncStatus('local');
  });
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+tab));
  localStorage.setItem(LAST_TAB_KEY, tab);
}

function render(){
  renderItemsTab();
  renderAlertTab();
  renderSimpleBoardTab('brew', 'brewboard', '跨店沖煮豆庫存看板');
  renderSimpleBoardTab('filter', 'filterboard', '跨店濾掛庫存看板');
  renderTransfersTab();
  renderAnnouncementsTab();
  renderReportsTab();
  renderSettingsTab();
}
function itemName(id){ const it = ITEMS_ALL.find(i=>i.id===id); return it ? it.name : '（已刪除品項）'; }
function storeName(id){ const s = STORES.find(x=>x.id===id); return s ? s.name : id; }

// ══════════ 品項管理 ══════════
function renderItemsTab(){
  const el = document.getElementById('tab-items');
  el.innerHTML = `
    <div class="section">
      <h2>新增品項</h2>
      <div style="display:flex;gap:8px;">
        <input type="text" id="newItemName" placeholder="品項名稱" style="flex:1;">
        <button class="btn" onclick="addItem()">新增</button>
      </div>
    </div>
    <div class="section">
      <h2>品項清單（共 ${ITEMS_ALL.length} 項，啟用 ${ITEMS.length} 項）</h2>
      <table>
        <thead><tr><th style="width:36px"></th><th>品項名稱</th><th style="width:70px">狀態</th><th style="width:220px"></th></tr></thead>
        <tbody>
          ${ITEMS_ALL.map((it,idx)=>`
            <tr>
              <td data-label="序">${idx+1}</td>
              <td data-label="品項名稱"><input type="text" class="item-name-input" value="${it.name}" onchange="renameItem(${it.id}, this.value)"></td>
              <td data-label="狀態">${it.active ? '<span class="badge" style="background:var(--ok)">啟用</span>' : '<span class="badge">停用</span>'}</td>
              <td data-label="操作" style="flex-wrap:wrap;justify-content:flex-end;">
                <button class="btn-outline" onclick="moveItem(${it.id},-1)">↑</button>
                <button class="btn-outline" onclick="moveItem(${it.id},1)">↓</button>
                <button class="btn-outline" onclick="toggleItemActive(${it.id}, ${!it.active})">${it.active?'停用':'啟用'}</button>
                <button class="btn-danger" onclick="deleteItem(${it.id}, '${it.name.replace(/'/g,"\\'")}')">刪除</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
async function addItem(){
  const input = document.getElementById('newItemName');
  const name = input.value.trim();
  if (!name) return;
  const maxSort = Math.max(0, ...ITEMS_ALL.map(i=>i.sort_order));
  await sb.from('items').insert({ name, active:true, sort_order:maxSort+1 });
  input.value=''; toast('已新增品項'); loadAll();
}
async function renameItem(id, name){
  name = name.trim(); if (!name) return;
  await sb.from('items').update({ name }).eq('id', id); toast('已更新品項名稱'); loadAll();
}
async function toggleItemActive(id, active){

async function moveItem(id, dir){
  const idx = ITEMS_ALL.findIndex(i=>i.id===id);
  const swapIdx = idx+dir;
  if (swapIdx<0 || swapIdx>=ITEMS_ALL.length) return;
  const a = ITEMS_ALL[idx], b = ITEMS_ALL[swapIdx];
  await Promise.all([
    sb.from('items').update({ sort_order:b.sort_order }).eq('id', a.id),
    sb.from('items').update({ sort_order:a.sort_order }).eq('id', b.id)
  ]);
  loadAll();
}

function openAddBatchModal(channel){

async function saveAddBatch(channel){

  const roastInput = document.getElementById('nbRoast');
  const roast_date = roastInput ? roastInput.value : todayStr();

  }
  return `<div class="batch-line ${cls}">

function allocRowHtml(batchId, decision, qty, note){
  return `<div class="alloc-row" style="display:flex;gap:4px;align-items:center;margin-bottom:4px;flex-wrap:wrap;">
    <select class="alloc-decision">${DECISIONS.map(d=>`<option ${d===decision?'selected':''}>${d}</option>`).join('')}</select>
    <input type="number" class="alloc-qty mini-input" min="0" value="${qty}" oninput="updateAllocTotal(${batchId})">
    <input type="text" class="alloc-note mini-input" style="width:90px" placeholder="備註" value="${note}">
    <button class="btn-outline" onclick="removeAllocRow(this, ${batchId})">✕</button>
  </div>`;
}
function toggleRecallForm(batchId){
  const el = document.getElementById('recall-form-'+batchId);
  if (el){ el.style.display = el.style.display==='none' ? 'block' : 'none'; updateAllocTotal(batchId); }
}
function addAllocRow(batchId){
  const b = BATCHES.find(x=>x.id===batchId);
  const container = document.getElementById('alloc-rows-'+batchId);
  const allocated = sumAllocQty(batchId);
  const remain = Math.max(0, (b?.quantity||0) - allocated);
  container.insertAdjacentHTML('beforeend', allocRowHtml(batchId, DECISIONS[0], remain, ''));
  updateAllocTotal(batchId);
}
function removeAllocRow(btn, batchId){
  btn.closest('.alloc-row').remove();
  updateAllocTotal(batchId);
}
function sumAllocQty(batchId){
  const container = document.getElementById('alloc-rows-'+batchId);
  let sum = 0;
  container.querySelectorAll('.alloc-qty').forEach(inp=>{ sum += Number(inp.value||0); });
  return sum;
}
function updateAllocTotal(batchId){
  const b = BATCHES.find(x=>x.id===batchId);
  const target = b ? b.quantity : 0;
  const sum = sumAllocQty(batchId);
  const el = document.getElementById('alloc-total-'+batchId);
  if (!el) return;
  const ok = sum === target;
  el.textContent = `已分配 ${sum} / 總量 ${target}`;
  el.style.color = ok ? 'var(--ok)' : 'var(--danger)';
  el.style.fontWeight = '600';
}
async function initiateRecall(batchId){
  const b = BATCHES.find(x=>x.id===batchId);
  if (!b) return;
  const container = document.getElementById('alloc-rows-'+batchId);
  const allocations = [];
  container.querySelectorAll('.alloc-row').forEach(row=>{
    const decision = row.querySelector('.alloc-decision').value;
    const qty = Number(row.querySelector('.alloc-qty').value||0);
    const note = row.querySelector('.alloc-note').value.trim();
    if (qty>0) allocations.push({ decision, qty, note });
  });
  const total = allocations.reduce((s,a)=>s+a.qty,0);
  if (!allocations.length || total !== b.quantity){
    toast(`分配總數需等於批次總量 ${b.quantity}（目前 ${total}）`); return;
  }
  for (const a of allocations){
    const { data:newBatch, error:e1 } = await sb.from('batches').insert({
      store_id:b.store_id, item_id:b.item_id, channel:b.channel, roast_date:b.roast_date,
      quantity:a.qty, status:'return_pending', disposal_action:a.decision, disposal_note:a.note, source:b.source
    }).select().single();
    if (e1){ toast('通知失敗：'+e1.message); return; }
    const { error:e2 } = await sb.from('returns').insert({
      batch_id:newBatch.id, store_id:b.store_id, item_id:b.item_id, quantity:a.qty, roast_date:b.roast_date,
      factory_decision:a.decision, decision_note:a.note, status:'pending'
    });
    if (e2){ toast('通知失敗：'+e2.message); return; }
  }
  const { error:e3 } = await sb.from('batches').delete().eq('id', batchId);
  if (e3){ toast('通知失敗（分批已建立，但原批次未清除）：'+e3.message); return; }
  toast('已通知門店'); loadAll();
}

function taipeiMonthOf(iso){
  const s = taipeiShifted(new Date(iso).getTime());
  return `${s.getUTCFullYear()}-${String(s.getUTCMonth()+1).padStart(2,'0')}`;
}

function renderReportsContent(){
  const month = document.getElementById('reportMonthSelect').value;
  if (!month) return;
  renderLossReport(month);
  renderTransferReport(month);
}
const DECISION_LIST = ['調回','變成出杯豆','報廢','其他'];
function computeLossReport(month){
  const rows = RETURNS.filter(r => taipeiMonthOf(r.submitted_at) === month);
  const totalByDecision = {};
  let totalQty = 0;
  rows.forEach(r=>{
    const d = r.factory_decision || '其他';
    totalByDecision[d] = (totalByDecision[d]||0) + Number(r.quantity);
    totalQty += Number(r.quantity);
  });
  const byKey = {};
  rows.forEach(r=>{
    const key = r.store_id+'::'+r.item_id;
    if (!byKey[key]) byKey[key] = { store_id:r.store_id, item_id:r.item_id, decisions:{}, total:0 };
    const d = r.factory_decision || '其他';
    byKey[key].decisions[d] = (byKey[key].decisions[d]||0) + Number(r.quantity);
    byKey[key].total += Number(r.quantity);
  });
  const detailRows = Object.values(byKey).sort((a,b)=> storeName(a.store_id).localeCompare(storeName(b.store_id)) || itemName(a.item_id).localeCompare(itemName(b.item_id)));
  return { rows, totalQty, totalByDecision, detailRows };
}
function renderLossReport(month){
  const el = document.getElementById('lossReportContent');
  const { rows, totalQty, totalByDecision, detailRows } = computeLossReport(month);
  if (!rows.length){ el.innerHTML = `<div class="empty-msg">該月份沒有回收紀錄</div>`; return; }

  const summaryHtml = `<div class="legend" style="margin-bottom:14px;">
    <span><b>總回收包數：${totalQty}</b></span>
    ${DECISION_LIST.map(d=>{
      const q = totalByDecision[d]||0;
      const pct = totalQty ? Math.round(q/totalQty*100) : 0;
      return `<span>${d}：${q}（${pct}%）</span>`;
    }).join('')}
  </div>`;

  el.innerHTML = summaryHtml + `<table>
    <thead><tr><th>門店</th><th>品項</th>${DECISION_LIST.map(d=>`<th>${d}</th>`).join('')}<th>小計</th></tr></thead>
    <tbody>${detailRows.map(row=>`
      <tr>
        <td data-label="門店">${storeName(row.store_id)}</td>
        <td data-label="品項">${itemName(row.item_id)}</td>
        ${DECISION_LIST.map(d=>`<td data-label="${d}">${row.decisions[d]||0}</td>`).join('')}
        <td data-label="小計"><b>${row.total}</b></td>
      </tr>`).join('')}</tbody>
  </table>`;
}
function computeTransferStats(rows, keyFn){
  const map = {};
  rows.forEach(t=>{
    const k = keyFn(t);
    if (!map[k]) map[k] = { total:0, approved:0, rejected:0, pending:0 };
    map[k].total++;
    map[k][t.status]++;
  });
  return map;
}
function computeTransferReport(month){
  const rows = TRANSFERS.filter(t => taipeiMonthOf(t.requested_at) === month);
  return {
    rows,
    byRequester: computeTransferStats(rows, t=>t.requesting_store_id),
    bySource: computeTransferStats(rows, t=>t.source_store_id)
  };
}
function renderTransferReport(month){
  const el = document.getElementById('transferReportContent');
  const { rows, byRequester, bySource } = computeTransferReport(month);
  if (!rows.length){ el.innerHTML = `<div class="empty-msg">該月份沒有調貨申請紀錄</div>`; return; }

  function tableFor(map, label){
    const storeIds = Object.keys(map).sort((a,b)=>storeName(a).localeCompare(storeName(b)));
    return `<div class="item-block">
      <div class="item-block-title">${label}</div>
      <table>
        <thead><tr><th>門店</th><th>總申請數</th><th>已核准</th><th>已拒絕</th><th>待審核</th><th>核准率</th></tr></thead>
        <tbody>${storeIds.map(id=>{
          const s = map[id];
          const decided = s.approved + s.rejected;
          const rate = decided ? Math.round(s.approved/decided*100)+'%' : '—';
          return `<tr>
            <td data-label="門店">${storeName(id)}</td>
            <td data-label="總申請數">${s.total}</td>
            <td data-label="已核准">${s.approved}</td>
            <td data-label="已拒絕">${s.rejected}</td>
            <td data-label="待審核">${s.pending}</td>
            <td data-label="核准率">${rate}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
  }
  el.innerHTML = tableFor(byRequester, '各店發起調貨申請') + tableFor(bySource, '各店被申請調貨（來源店）');
}
function exportReportsExcel(){
  const month = document.getElementById('reportMonthSelect').value;
  if (!month){ toast('請先選擇月份'); return; }
  const { totalQty, totalByDecision, detailRows } = computeLossReport(month);
  const { byRequester, bySource } = computeTransferReport(month);

  const wb = XLSX.utils.book_new();

  const lossAoa = [
    [`${month} 月度效期損耗報表`],
    ['總回收包數', totalQty],
    ...DECISION_LIST.map(d => [d, totalByDecision[d]||0, totalQty ? Math.round((totalByDecision[d]||0)/totalQty*100)+'%' : '0%']),
    [],
    ['門店','品項', ...DECISION_LIST, '小計'],
    ...detailRows.map(row => [storeName(row.store_id), itemName(row.item_id), ...DECISION_LIST.map(d=>row.decisions[d]||0), row.total])
  ];
  const lossSheet = XLSX.utils.aoa_to_sheet(lossAoa);
  XLSX.utils.book_append_sheet(wb, lossSheet, '效期損耗報表');

  function transferAoa(map, label){
    const storeIds = Object.keys(map).sort((a,b)=>storeName(a).localeCompare(storeName(b)));
    return [
      [label],
      ['門店','總申請數','已核准','已拒絕','待審核','核准率'],
      ...storeIds.map(id=>{
        const s = map[id];
        const decided = s.approved + s.rejected;
        const rate = decided ? Math.round(s.approved/decided*100)+'%' : '—';
        return [storeName(id), s.total, s.approved, s.rejected, s.pending, rate];
      })
    ];
  }
  const transferAoaAll = [
    ...transferAoa(byRequester, '各店發起調貨申請'),
    [],
    ...transferAoa(bySource, '各店被申請調貨（來源店）')
  ];
  const transferSheet = XLSX.utils.aoa_to_sheet(transferAoaAll);
  XLSX.utils.book_append_sheet(wb, transferSheet, '調貨往來報表');

  XLSX.writeFile(wb, `phase-coffee-ops_報表_${month}.xlsx`);
}

      ${STORES.map(st=>`

      <p style="color:var(--gray-50);font-size:12.5px;margin-bottom:10px;">工廠端（本頁）自己的 8 位數 PIN，與門店 PIN 不同。</p>
      <div class="addon-row">
        <div><b>工廠端</b></div>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="text" inputmode="numeric" maxlength="8" placeholder="輸入新的 8 位數 PIN" id="newpin-factory" class="mini-input" style="width:130px;">
          <button class="btn-sm" onclick="resetFactoryPin()">重設</button>
        </div>
      </div>
    </div>`;
}
async function resetStorePin(storeId){
  const input = document.getElementById('newpin-'+storeId);
  const pin = input.value.trim();
  if (!/^\d{8}$/.test(pin)){ toast('PIN 需為 8 位數字'); return; }
  const pin_hash = await sha256Hex(pin);
  const { error } = await sb.from('store_pins').upsert({ store_id:storeId, pin_hash, updated_at:new Date().toISOString() }, { onConflict:'store_id' });
  if (error){ toast('重設失敗：'+error.message); return; }
  input.value=''; toast('已重設 PIN');
}
async function resetFactoryPin(){
  const input = document.getElementById('newpin-factory');
  const pin = input.value.trim();
  if (!/^\d{8}$/.test(pin)){ toast('PIN 需為 8 位數字'); return; }
  const pin_hash = await sha256Hex(pin);
  const { error } = await sb.from('factory_auth').upsert({ id:'factory', pin_hash, updated_at:new Date().toISOString() }, { onConflict:'id' });
  if (error){ toast('重設失敗：'+error.message); return; }
  input.value=''; toast('已重設工廠端 PIN，下次登入請用新密碼');
}

// ══════════ 備份還原 + PWA ══════════
function toggleBackupMenu(){
  const el = document.getElementById('backupMenu');
  el.style.display = el.style.display==='block' ? 'none' : 'block';
}
document.addEventListener('click', e=>{
  const menu = document.getElementById('backupMenu');
  if (!menu) return;
  if (!e.target.closest('#backupMenu') && e.target.tagName!=='BUTTON'){ menu.style.display='none'; }
});
const BACKUP_TABLES = ['stores','items','batches','returns','store_pins','factory_auth','transfer_requests','announcements','announcement_receipts'];
const BACKUP_CONFLICT_KEY = { store_pins:'store_id' };
async function exportBackup(){
  toggleBackupMenu();
  const tables = {};
  for (const t of BACKUP_TABLES){
    const { data } = await sb.from(t).select('*');
    tables[t] = data || [];
  }
  const payload = { exported_at:new Date().toISOString(), source:'factory.html', tables };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `phase-coffee-ops_full_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}
async function handleRestoreFile(ev){
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  if (!confirm('匯入還原只會新增／更新資料（以匯入內容覆蓋相同 id 的既有資料），不會刪除現有資料。確定要繼續嗎？')) return;
  try{
    const payload = JSON.parse(await file.text());
    const tables = payload.tables || {};
    for (const t of BACKUP_TABLES){
      const rows = tables[t];
      if (!rows || !rows.length) continue;
      const { error } = await sb.from(t).upsert(rows, { onConflict: BACKUP_CONFLICT_KEY[t] || 'id' });
      if (error) throw new Error(t+': '+error.message);
    }
    toast('匯入還原完成'); loadAll();
  }catch(e){ toast('匯入失敗：'+e.message); }
}

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
